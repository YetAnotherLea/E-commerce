# Front et API sur le même domaine en production : le CORS ne sert qu'en dev,
# où Vite tourne sur :5173 et Symfony sur :8000.
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ["%env(CORS_ALLOW_ORIGIN)%"]
        allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
        allow_headers: ["Content-Type", "Authorization"]
        expose_headers: ["Link"]
        allow_credentials: true
        max_age: 3600
    paths:
        '^/': null
